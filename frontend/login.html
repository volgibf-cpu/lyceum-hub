<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — Проф. лицей</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />
  <link rel="stylesheet" href="static/css/style.css" />
</head>
<body>
  <div class="app">
    <!-- Сайдбар — как в расписании -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-icon">🎓</span>
        <span class="brand-title">Проф. лицей</span>
      </div>
      <nav class="nav">
        <a class="nav-link" href="index.html"><span>🏠</span> Главная</a>
        <a class="nav-link" href="schedule.html"><span>📅</span> Расписание</a>
        <a class="nav-link" href="grades.html"><span>📊</span> Оценки</a>
        <a class="nav-link" href="/app/students.html" id="nav-students" style="display:none">
          <span>👥</span> Ученики
        </a>
        <a class="nav-link" href="/app/set-grade.html" id="nav-set-grade" style="display:none">
          <span>✏️</span> Выставить оценку
        </a>
        <a class="nav-link" href="profile.html"><span>👤</span> Профиль</a>
      </nav>
    </aside>

    <!-- Основная часть -->
    <main class="main">
      <header class="topbar">
        <div>
          <h1>Вход в систему</h1>
          <div class="topbar-sub">Личный кабинет лицеиста</div>
        </div>
      </header>

      <section class="card login-card">
        <!-- Логотип -->
        <div class="login-logo-wrap">
          <div class="login-logo">🔐</div>
        </div>

        <h2 class="login-title">С возвращением 👋</h2>
        <p class="login-subtitle">Войдите, чтобы посмотреть расписание и оценки</p>

        <form id="login-form" class="form">

          <label class="field">
            <span>Email</span>
            <div class="input-wrap">
              <span class="input-icon">📧</span>
              <input
                type="email"
                name="email"
                required
                placeholder="you@example.com"
                autocomplete="email"
                autofocus
              />
            </div>
          </label>

          <label class="field">
            <span>Пароль</span>
            <div class="input-wrap">
              <span class="input-icon">🔒</span>
              <input
                type="password"
                name="password"
                required
                placeholder="••••••••"
                autocomplete="current-password"
                id="password-input"
              />
              <button type="button" class="input-suffix" id="toggle-password" title="Показать пароль">
                👁
              </button>
            </div>
          </label>

          <div class="form-error" id="login-error"></div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-submit">
            Войти →
          </button>

        </form>

        <div class="login-hint">
          <span class="muted">Забыли пароль?</span>
          <a href="#">Обратитесь к завучу</a>
        </div>
      </section>
    </main>
  </div>

  <script>
    const API_BASE = localStorage.getItem('api_base') || 'http://127.0.0.1:8000';
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('login-error');
    const submitBtn = document.getElementById('login-submit');
    const passwordInput = document.getElementById('password-input');
    const toggleBtn = document.getElementById('toggle-password');

    toggleBtn.addEventListener('click', () => {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      toggleBtn.textContent = isHidden ? '🙈' : '👁';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      errorEl.classList.remove('show');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Входим…';

      try {
        const response = await fetch(`${API_BASE}/auth`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            email: form.email.value.trim(),
            password: form.password.value,
          }),
        });

        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.detail || `Ошибка ${response.status}`);
        }

        location.href = '/app/schedule.html';
      } catch (err) {
        errorEl.textContent = err.message || 'Не удалось войти';
        errorEl.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Войти →';
      }
    });
  </script>
</body>
</html>
